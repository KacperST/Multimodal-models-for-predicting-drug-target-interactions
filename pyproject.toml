[project]
name = "dti"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black[jupyter]>=26.3.1",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "numpy<2",
    "ogb>=1.3.6",
    "polars>=1.39.3",
    "rdkit>=2023.9.6",
    "torch>=2.12.0",
    "torch-geometric>=2.8.0",
    "tqdm>=4.67.3",
    "pyyaml>=6.0",
    "scikit-learn>=1.5.0",
    "transformers>=5.7.0",
    "scikit-fingerprints>=1.0.0",
    "peft>=0.19.1",
    "bitsandbytes>=0.49.2",
    "accelerate>=1.13.0",
    "seaborn>=0.13.2",
    "cmappy>=4.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
