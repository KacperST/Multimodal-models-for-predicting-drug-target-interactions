data:
  clean_path: datasets/clean.parquet
  path: datasets/BindingDB_All.tsv
  pki_threshold: 7.0
  split_ratios:
  - 0.7
  - 0.1
  - 0.2
smiles_encoders:
- type: gcn
  params:
    hidden_dim: 256
    num_layers: 3
- type: fingerprint_mlp
  params:
    fp_type: ecfp
    fp_params:
      radius: 2
      fp_size: 1024
    hidden_dim: 512
    out_dim: 256
    dropout: 0.2
- type: chembert
  params:
    model_name: seyonec/ChemBERTa-zinc-base-v1
    max_length: 256
    out_dim: 256
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
protein_encoders:
- type: esm2
  params:
    model_name: facebook/esm2_t33_650M_UR50D
    max_length: 1024
    out_dim: 256
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
fusion:
  type: mlp
  params:
    hidden_dims:
    - 256
    - 64
    dropout: 0.3
training:
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 1.0e-05
  epochs: 100
  patience: 8
  num_workers: 4
  device: auto
