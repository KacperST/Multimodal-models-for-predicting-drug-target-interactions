# ─────────────────────────────────────────────────────────
# GCN + ECFP  ×  CNN + ESM-2
# ─────────────────────────────────────────────────────────
# SMILES: GCN (256) + ECFP (256) → concat (512)
# Protein: CNN (384) + ESM-2 (256) → concat (640)
# Fusion: Cross-Attention

data:
  clean_path: "datasets/clean.parquet"
  path: "datasets/BindingDB_All.tsv"
  pki_threshold: 7.0
  split_ratios: [0.7, 0.1, 0.2]

smiles_encoders:
  - type: "gcn"
    params:
      hidden_dim: 256
      num_layers: 3

  - type: "fingerprint_mlp"
    params:
      fp_type: "ecfp"
      fp_params: { fp_size: 2048, radius: 2 }
      hidden_dim: 512
      out_dim: 256

protein_encoders:
  - type: "cnn"
    params:
      embed_dim: 256
      num_filters: 128
      kernel_sizes: [3, 7, 15]
      max_seq_len: 1000

  - type: "esm2"
    params:
      model_name: "facebook/esm2_t33_650M_UR50D"
      out_dim: 256
      freeze: true
      max_seq_len: 1000

# smiles_dim = 256 (GCN) + 256 (FP) = 512
# protein_dim = 384 (CNN) + 256 (ESM-2) = 640
fusion:
  type: "cross_attention"
  params:
    proj_dim: 256
    num_heads: 4
    hidden_dim: 128
    dropout: 0.3

training:
  batch_size: 128
  learning_rate: 0.0001
  weight_decay: 0.00001
  epochs: 50
  patience: 10
  num_workers: 4
  device: "auto"
