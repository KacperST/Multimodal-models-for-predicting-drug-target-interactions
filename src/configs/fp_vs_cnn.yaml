data:
  clean_path: datasets/clean.parquet
  path: datasets/BindingDB_All.tsv
  pki_threshold: 7.0
  split_ratios:
  - 0.7
  - 0.1
  - 0.2
smiles_encoders:
- type: fingerprint_mlp
  params:
    fp_type: ecfp
    fp_params:
      radius: 2
      fp_size: 1024
    hidden_dim: 512
    out_dim: 256
    dropout: 0.2
protein_encoders:
- type: cnn
  params:
    embed_dim: 256
    num_filters: 128
    kernel_sizes:
    - 3
    - 7
    - 15
    max_seq_len: 1000
fusion:
  type: cross_attention
training:
  batch_size: 256
  learning_rate: 5.0e-05
  weight_decay: 0.01
  epochs: 100
  patience: 8
  num_workers: 8
  device: auto
