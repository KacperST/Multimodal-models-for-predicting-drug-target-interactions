# ─────────────────────────────────────────────────────────
# Default configuration for multimodal DTI experiments
# ─────────────────────────────────────────────────────────

data:
  # Set clean_path to load pre-cleaned data (run prepare_data.py first)
  clean_path: "datasets/clean.parquet"
  # Fallback: if clean_path is not set, raw TSV will be loaded and cleaned on the fly
  path: "datasets/BindingDB_All.tsv"
  pki_threshold: 7.0        # pKi >= threshold → active
  split_ratios: [0.7, 0.1, 0.2]   # train / val / test

# ── SMILES branch ────────────────────────────────────────
# Each entry is a (processor, encoder) pair.
# Available types: "gcn", "fingerprint_mlp", "chembert"
smiles_encoders:
  - type: "gcn"
    params:
      hidden_dim: 256
      num_layers: 3

# ── Protein branch ───────────────────────────────────────
# Available types: "cnn", "esm2"
protein_encoders:
  - type: "cnn"
    params:
      embed_dim: 256
      num_filters: 128
      kernel_sizes: [3, 7, 15]
      max_seq_len: 1000

# ── Fusion ───────────────────────────────────────────────
# Available types: "mlp", "cross_attention"
fusion:
  type: "mlp"
  params:
    hidden_dims: [256, 64]
    dropout: 0.3

# ── Training ─────────────────────────────────────────────
training:
  batch_size: 256
  learning_rate: 0.0001
  weight_decay: 0.00001
  epochs: 50
  patience: 8
  num_workers: 4
  device: "auto"            # "auto", "cuda", or "cpu"
