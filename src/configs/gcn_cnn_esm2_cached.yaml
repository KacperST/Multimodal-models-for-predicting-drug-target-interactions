# ─────────────────────────────────────────────────────────
# GCN  ×  CNN + ESM-2 (cached embeddings)
# ─────────────────────────────────────────────────────────
# Same architecture as gcn_cnn_esm2.yaml, but uses
# pre-computed ESM-2 embeddings for speed.
#
# Before training, run:
#   python precompute_esm2.py --model facebook/esm2_t33_650M_UR50D
#
# SMILES: GCN (256)
# Protein: CNN (384) + CachedESM-2 (256) → concat (640)
# Fusion: MLP

data:
  clean_path: "datasets/clean.parquet"
  path: "datasets/BindingDB_All.tsv"
  pki_threshold: 7.0
  split_ratios: [0.7, 0.1, 0.2]

smiles_encoders:
  - type: "gcn"
    params:
      hidden_dim: 256
      num_layers: 3

protein_encoders:
  - type: "cnn"
    params:
      embed_dim: 256
      num_filters: 128
      kernel_sizes: [3, 7, 15]
      max_seq_len: 1000

  - type: "esm2_cached"
    params:
      cache_path: "datasets/esm2_t33_650M_UR50D.pt"
      out_dim: 256

# smiles_dim = 256 (GCN)
# protein_dim = 384 (CNN) + 256 (ESM-2) = 640
fusion:
  type: "mlp"
  params:
    hidden_dims: [256, 64]
    dropout: 0.3

training:
  batch_size: 128
  learning_rate: 0.0001
  weight_decay: 0.00001
  epochs: 50
  patience: 8
  num_workers: 4
  device: "auto"
