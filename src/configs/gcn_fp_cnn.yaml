# ─────────────────────────────────────────────────────────
# GCN + ECFP fingerprints  ×  CNN
# ─────────────────────────────────────────────────────────
# SMILES: GCN (graph) + ECFP (fingerprint) → concat (512)
# Protein: CNN (384)
# Fusion: MLP

data:
  clean_path: "datasets/clean.parquet"
  path: "datasets/BindingDB_All.tsv"
  pki_threshold: 7.0
  split_ratios: [0.7, 0.1, 0.2]

smiles_encoders:
  - type: "gcn"
    params:
      hidden_dim: 256
      num_layers: 3

  - type: "fingerprint_mlp"
    params:
      fp_type: "ecfp"
      fp_params: { fp_size: 2048, radius: 2 }
      hidden_dim: 512
      out_dim: 256

protein_encoders:
  - type: "cnn"
    params:
      embed_dim: 256
      num_filters: 128
      kernel_sizes: [3, 7, 15]
      max_seq_len: 1000

# smiles_dim = 256 (GCN) + 256 (FP) = 512
# protein_dim = 384 (CNN: 128×3)
fusion:
  type: "mlp"
  params:
    hidden_dims: [256, 64]
    dropout: 0.3

training:
  batch_size: 256
  learning_rate: 0.0001
  weight_decay: 0.00001
  epochs: 50
  patience: 8
  num_workers: 4
  device: "auto"
